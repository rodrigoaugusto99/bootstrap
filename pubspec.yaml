name: bootstrap
description: A new Flutter project.
publish_to: "none"
# O "+N" e o build number. No Android vira o versionCode, e o Play Console
# recusa upload com versionCode ja usado - incremente a cada envio.
# No iOS o codemagic.yaml sobrescreve com get-latest-testflight-build-number + 1.
version: 0.1.0+1

environment:
  sdk: ">=3.0.3 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  cloud_firestore: ^6.1.1
  internet_connection_checker_plus: ^2.5.1
  dio: ^5.9.0
  easy_mask: ^2.0.1
  firebase_auth: ^6.1.3
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  firebase_storage: ^13.0.5
  flutter:
    sdk: flutter
  flutter_email_sender: ^8.0.0
  flutter_local_notifications: ^19.5.0
  flutter_native_splash: ^2.4.4
  flutter_styled_toast: ^2.3.0
  flutter_svg: ^2.1.0
  geocoding: ^4.0.0
  geolocator: ^14.0.2
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  image_picker: ^1.1.2
  loader_overlay: ^4.0.4+1
  logarte: ^1.4.0
  logger: ^1.4.0
  package_info_plus: ^9.0.0
  uuid: ^4.6.0
  pin_code_fields: ^8.0.1
  shared_preferences: ^2.5.3
  sign_in_with_apple: ^7.0.1
  skeletonizer: ^2.1.2
  stacked: ^3.4.0
  stacked_services: ^1.1.0
  share_plus: ^12.0.2
  url_launcher: ^6.3.1
  intl: ^0.20.2
  currency_text_input_formatter: ^2.3.0
  cue: ^0.3.1

# Ferramentas de linha de comando (geradores). Nao entram no app: nada aqui e
# importado pelo codigo, entao nao e compilado no APK/AAB/IPA.
#   change_app_package_name -> dart run change_app_package_name:main com.redarock.<app>
#   flutter_launcher_icons  -> dart run flutter_launcher_icons
# (flutter_native_splash fica em dependencies porque o main.dart usa
#  FlutterNativeSplash.preserve() e a splash usa .remove() em tempo de execucao.)
dev_dependencies:
  build_runner: ^2.4.5
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  mockito: ^5.4.1
  stacked_generator: ^1.3.3
  golden_toolkit: ^0.15.0

# Gera os icones das duas plataformas a partir de UM png 1024x1024.
# Rodar depois de trocar o assets/icon/icon.png:  dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  ios: true
  # A Apple RECUSA o upload se o icone de 1024 tiver canal alfa. Isso resolve.
  remove_alpha_ios: true
  # Icone adaptativo do Android (a partir do 8.0). O background costuma ser a
  # cor da marca; o foreground, a logo com margem de seguranca.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

flutter:
  uses-material-design: true

  # assets/icon/ NAO entra aqui de proposito: o flutter_launcher_icons le a arte
  # do disco em tempo de build e gera os icones nativos. Declarar como asset so
  # empacotaria o png de 1024 dentro do app sem ninguem usar.
  assets:
    - assets/images/
